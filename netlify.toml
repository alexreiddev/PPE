# Oasis Star General Trading — static site, no build step.
#
# The site lives in site/. Everything outside it — docs/, CLAUDE.md, .claude/ —
# is internal and must never be served, so publish is scoped to site/ rather
# than the repo root. Headers and redirects below are relative to the published
# root, i.e. site/.

[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Friendly URLs
[[redirects]]
  from = "/catalogue"
  to = "/products.html"
  status = 301

[[redirects]]
  from = "/enquiry"
  to = "/enquiry.html"
  status = 301
